# Versioned fixture manifest used by the detection-quality tests
# (backend/tests/test_rules.py) and benchmark script.
#
# Paths are relative to the materialised fixture root:
#   synthetic_positive/...  rendered from *.tmpl templates at test time
#   benign_negative/...     committed verbatim (benign by construction)
#
# Acceptance targets (PRD 4.3): detection >= 90%, false positives <= 10%.

version: 1

positives:
