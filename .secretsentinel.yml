# SecretSentinel policy for THIS repository (used by .github/workflows/secret-scan.yml).
# In CI the policy is read from the trusted base branch, so a pull request cannot
# relax its own gate. Protect this file with CODEOWNERS review.
version: 1
fail_on: high
# Positive fixtures are committed only as templates without secret values, so
# nothing needs to be excluded. Add globs here only after review.
exclude_paths: []
suppressions: []
