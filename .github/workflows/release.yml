name: Release to PyPI

# Publishes the secretsentinel-scanner package when a version tag (v1.2.3) is
# pushed. Uses PyPI trusted publishing: no API token is stored anywhere.
#
# One-time setup (see docs/RELEASING.md):
#   GitHub  Settings -> Environments -> "pypi": tags matching v*, and optionally
#           yourself as a required reviewer so every publish waits for a click.
#   PyPI    Publishing -> pending publisher: project secretsentinel-scanner,
#           owner SaIdEeVaN, repository secretsentinel, workflow release.yml,
#           environment pypi.
#
# PyPI never accepts the same version twice, so the build job checks everything
# (tag = package version, metadata, a clean install that finds its rules and
# blocks the demo) before the publish job runs.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Tag must match the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("backend/pyproject.toml", "rb"))["project"]["version"])')"
          if [[ "$TAG" != "v$version" ]]; then
            echo "::error::Tag $TAG does not match version $version in backend/pyproject.toml"
            exit 1
          fi
      - name: Install pinned Gitleaks (checksum verified)
        run: bash scripts/install_gitleaks.sh "$GITLEAKS_VERSION" "$GITLEAKS_SHA256" "$RUNNER_TEMP/bin"
      - name: Build sdist and wheel
        run: |
          python -m pip install --disable-pip-version-check "build==1.6.1" "twine==7.0.0"
          python -m build backend --outdir dist
          python -m twine check --strict dist/*
      - name: Install the wheel in a clean venv and scan the demo outside the checkout
        env:
          GITLEAKS_PATH: ${{ runner.temp }}/bin/gitleaks
        run: bash scripts/check_package.sh dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/secretsentinel-scanner/
    permissions:
      id-token: write # trusted publishing; this job gets nothing else
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
