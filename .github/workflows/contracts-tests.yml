name: Contracts tests (optional P2)

# The blockchain extension is optional and disabled by default. These jobs run
# entirely on a local Hardhat chain: no RPC provider, keys or test ETH needed.

on:
  pull_request:
    paths: ["contracts/**", "backend/secretsentinel/services/attestation*.py", "backend/secretsentinel/services/chain.py", "backend/tests/test_chain_interop.py", ".github/workflows/contracts-tests.yml"]
  push:
    branches: [main]
    paths: ["contracts/**", "backend/secretsentinel/services/attestation*.py", "backend/secretsentinel/services/chain.py", "backend/tests/test_chain_interop.py", ".github/workflows/contracts-tests.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hardhat:
    name: ScanRegistry + Python interop (local chain)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install contract toolchain
        working-directory: contracts
        run: npm ci --no-audit --no-fund
      - name: Contract unit tests
        working-directory: contracts
        run: npx hardhat test
      - name: Start local chain and deploy registry
        working-directory: contracts
        run: |
          npx hardhat node --hostname 127.0.0.1 --port 8545 > "$RUNNER_TEMP/hardhat-node.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf -X POST -H 'Content-Type: application/json' \
              --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' http://127.0.0.1:8545 >/dev/null && break
            sleep 1
          done
          address="$(npx hardhat run scripts/deploy.js --network localhost | sed -n 's/.* at \(0x[0-9a-fA-F]\{40\}\)$/\1/p')"
          [[ "$address" =~ ^0x[0-9a-fA-F]{40}$ ]] || { echo "deployment failed"; exit 1; }
          echo "SECRETSENTINEL_TEST_REGISTRY=$address" >> "$GITHUB_ENV"
          echo "SECRETSENTINEL_TEST_RPC_URL=http://127.0.0.1:8545" >> "$GITHUB_ENV"
      - name: Install backend with blockchain extra
        run: python -m pip install -e "backend[dev]"
      - name: Python attestation client against the deployed contract
        working-directory: backend
        run: python -m pytest -q -m chain tests/test_chain_interop.py
