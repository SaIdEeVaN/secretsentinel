name: SecretSentinel Security Scan

# Make this job a REQUIRED status check ("secret-scan") in a branch ruleset or
# branch protection rule for main. A failing check alone does not block merges.
# See docs/CI_SETUP.md.

on:
  pull_request:
  push:
    branches: [main, "codex/**"]
  schedule:
    - cron: "17 3 * * 1" # weekly full-history scan of the default branch (CI-08)
  workflow_dispatch:

# Least privilege: read-only token, no secrets used anywhere in this workflow.
permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"
  # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz from the official release checksums.
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Code under test: treated purely as data. Nothing from it is executed.
      - name: Checkout code under test (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          path: target

      # Scanner, ruleset and policy come from the protected BASE commit, so a pull
      # request cannot weaken the gate (or add suppressions) in the same change.
      - name: Checkout trusted scanner and policy (base commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
          path: scanner

      - name: Select scanner source
        id: src
        run: |
          if [[ -f scanner/backend/secretsentinel/cli.py && -f scanner/rules/web3_rules.toml ]]; then
            echo "dir=scanner" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Trusted base has no SecretSentinel scanner. Install it on the protected branch before enabling this gate."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install pinned Gitleaks (checksum verified)
        run: bash "${{ steps.src.outputs.dir }}/scripts/install_gitleaks.sh" "$GITLEAKS_VERSION" "$GITLEAKS_SHA256" "$RUNNER_TEMP/bin"

      - name: Install scanner dependency (hash-pinned, no build step)
        run: python -m pip install --disable-pip-version-check --require-hashes --no-deps -r "${{ steps.src.outputs.dir }}/backend/requirements-ci.txt"

      - name: Determine scan scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          is_sha() { [[ "$1" =~ ^[0-9a-f]{40}$ && "$1" != 0000000000000000000000000000000000000000 ]]; }
          mode=both; since=""
          if [[ "$EVENT" == "pull_request" ]] && is_sha "$PR_BASE"; then
            # New commits in the PR only; pre-existing history is covered by the
            # scheduled full scan and the reviewed baseline (CI-07).
            mode=git; since="$PR_BASE"
          elif [[ "$EVENT" == "push" ]] && is_sha "$PUSH_BEFORE" && git -C target cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            mode=git; since="$PUSH_BEFORE"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "since=$since" >> "$GITHUB_OUTPUT"
          echo "Scan mode: $mode ${since:+(commits after ${since:0:12})}"

      - name: Run SecretSentinel and enforce policy
        env:
          SRC: ${{ steps.src.outputs.dir }}
          MODE: ${{ steps.scope.outputs.mode }}
          SINCE: ${{ steps.scope.outputs.since }}
          GITLEAKS_PATH: ${{ runner.temp }}/bin/gitleaks
          SCANNER_TIMEOUT_SECONDS: "600"
          FAIL_ON: high
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/$SRC/backend"
          export SECRETSENTINEL_RULES_DIR="$GITHUB_WORKSPACE/$SRC/rules"
          args=(check target --mode "$MODE" --github-annotations --github-summary --no-size-limit)
          [[ -n "$SINCE" ]] && args+=(--since "$SINCE")
          if [[ -f "$SRC/.secretsentinel.yml" ]]; then
            args+=(--policy "$SRC/.secretsentinel.yml")
          else
            args+=(--no-policy)
          fi
          # Exit codes: 0 pass, 1 blocking findings, 2 config error, 3 scan error.
          # Any nonzero code fails this required check (fail closed).
          python -m secretsentinel "${args[@]}"

      # Deliberately NO artifact upload: reports stay on the ephemeral runner (CI-05).
