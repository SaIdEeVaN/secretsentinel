name: Upload scan to SecretSentinel dashboard

# Scans the default branch (working tree + full history) and uploads only the
# SANITIZED report (rule IDs, locations, counts - never secret values) to the
# hosted dashboard. See docs/HOSTING.md.
#
# Trust model: runs ONLY for pushes to main, the weekly schedule and manual
# runs - never for pull requests - so the upload token is never exposed to code
# under review. Put SECRETSENTINEL_INGEST_TOKEN in the "secretsentinel-dashboard"
# environment and restrict that environment to the main branch.
#
# Setup (repository Settings -> Secrets and variables -> Actions):
#   variable  SECRETSENTINEL_DASHBOARD_URL  e.g. https://secretsentinel-dashboard.onrender.com
#   secret    SECRETSENTINEL_INGEST_TOKEN   the dashboard's INGEST_TOKEN
# The job is skipped while the variable is not set.

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-upload-${{ github.ref }}
  cancel-in-progress: false

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  upload:
    name: scan and upload
    if: ${{ vars.SECRETSENTINEL_DASHBOARD_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: secretsentinel-dashboard
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install pinned Gitleaks (checksum verified)
        run: bash scripts/install_gitleaks.sh "$GITLEAKS_VERSION" "$GITLEAKS_SHA256" "$RUNNER_TEMP/bin"

      - name: Install scanner dependency (hash-pinned)
        run: python -m pip install --disable-pip-version-check --require-hashes --no-deps -r backend/requirements-ci.txt

      - name: Scan default branch
        id: scan
        env:
          GITLEAKS_PATH: ${{ runner.temp }}/bin/gitleaks
          SCANNER_TIMEOUT_SECONDS: "600"
        run: |
          set +e
          export PYTHONPATH="$GITHUB_WORKSPACE/backend"
          export SECRETSENTINEL_RULES_DIR="$GITHUB_WORKSPACE/rules"
          report="$RUNNER_TEMP/secretsentinel-report.json"
          args=(check . --mode both --no-size-limit --format json --output "$report")
          if [[ -f .secretsentinel.yml ]]; then args+=(--policy .secretsentinel.yml); else args+=(--no-policy); fi
          python -m secretsentinel "${args[@]}"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # 0 = pass, 1 = blocking findings: both are results worth uploading.
          [[ -f "$report" ]] || { echo "::error::Scan produced no report (exit $code)."; exit 1; }

      - name: Upload sanitized report
        env:
          SECRETSENTINEL_DASHBOARD_URL: ${{ vars.SECRETSENTINEL_DASHBOARD_URL }}
          SECRETSENTINEL_INGEST_TOKEN: ${{ secrets.SECRETSENTINEL_INGEST_TOKEN }}
        run: python scripts/upload_report.py "$RUNNER_TEMP/secretsentinel-report.json"

      - name: Flag incomplete scans
        if: ${{ steps.scan.outputs.exit_code == '2' || steps.scan.outputs.exit_code == '3' }}
        run: |
          echo "::error::The scan did not complete (exit ${{ steps.scan.outputs.exit_code }}); it was uploaded with status failed."
          exit 1
