# Render Blueprint: hosted SecretSentinel dashboard (view-only).
#
# The service never scans or clones code. GitHub Actions scans repositories and
# uploads SANITIZED reports to /api/v1/ingest/scan-summary (see docs/HOSTING.md).
# API_TOKEN (dashboard sign-in) and INGEST_TOKEN (CI uploads) are generated by
# Render; read them in the dashboard under Environment and never commit them.
#
# The database is Neon Postgres, not a Render database. DB_URL is entered by
# hand (sync: false): Render asks for it when the Blueprint is first applied and
# never overwrites it on later syncs. Use the connection string of a dedicated,
# non-superuser Neon role that owns the database (docs/HOSTING.md).
#
# Free plans: the web service sleeps after 15 minutes idle (about a minute to
# wake); Neon's free compute scales to zero when idle and resumes on the next
# query. Neon free databases do not expire.

services:
  - type: web
    name: secretsentinel-dashboard
    runtime: python
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: commit
    buildCommand: >-
      python --version && node --version &&
      pip install --upgrade pip &&
      pip install -e "./backend[postgres]" &&
      cd frontend && npm ci --no-audit --no-fund && npm run build
    startCommand: python -m secretsentinel serve
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: APP_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: ALLOW_REMOTE
        value: "true"
      - key: LOG_LEVEL
        value: INFO
      - key: API_TOKEN
        generateValue: true
      - key: INGEST_TOKEN
        generateValue: true
      # postgresql://<role>:<password>@<endpoint>.neon.tech/<db>?sslmode=require&channel_binding=require
      - key: DB_URL
        sync: false
