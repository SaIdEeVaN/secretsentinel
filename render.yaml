# Render Blueprint: hosted SecretSentinel dashboard (view-only).
#
# The service never scans or clones code. GitHub Actions scans repositories and
# uploads SANITIZED reports to /api/v1/ingest/scan-summary (see docs/HOSTING.md).
# API_TOKEN (dashboard sign-in) and INGEST_TOKEN (CI uploads) are generated by
# Render; read them in the dashboard under Environment and never commit them.
#
# Free plans: the web service sleeps after 15 minutes idle (about a minute to
# wake); the free database expires 30 days after creation unless upgraded.

services:
  - type: web
    name: secretsentinel-dashboard
    runtime: python
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: commit
    buildCommand: >-
      python --version && node --version &&
      pip install --upgrade pip &&
      pip install -e "./backend[postgres]" &&
      cd frontend && npm ci --no-audit --no-fund && npm run build
    startCommand: python -m secretsentinel serve
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: APP_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: ALLOW_REMOTE
        value: "true"
      - key: LOG_LEVEL
        value: INFO
      - key: API_TOKEN
        generateValue: true
      - key: INGEST_TOKEN
        generateValue: true
      - key: DB_URL
        fromDatabase:
          name: secretsentinel-db
          property: connectionString

databases:
  - name: secretsentinel-db
    plan: free
    region: singapore
    databaseName: secretsentinel
    user: secretsentinel
    # No external access: only Render services on the private network connect.
    ipAllowList: []
